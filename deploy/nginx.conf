# 卡券比价雷达 · Nginx 反代（若你已有 Nginx + certbot）
#
# 步骤：
#   1) 把 kaquan.example.com 全部替换成你的域名，A 记录解析到本机公网 IP
#   2) 拷贝到 /etc/nginx/conf.d/kaquan.conf
#   3) 先只留 80 端口那段跑通，签发证书：
#        certbot --nginx -d kaquan.example.com
#      （或 certbot certonly --webroot -w /var/www/certbot -d kaquan.example.com）
#   4) nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name kaquan.example.com;

    # Let's Encrypt 校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kaquan.example.com;

    ssl_certificate     /etc/letsencrypt/live/kaquan.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaquan.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types application/json text/css application/javascript text/html;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:18801;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 手动触发刷新时是异步返回的，这里给宽一点
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:18801;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}

name: 卡券比价站数据更新

# 部署在 GitHub 的机器上跑，跟你的电脑开不开机完全无关。
on:
  schedule:
    # 每 6 小时一轮。GitHub 的 cron 用的是 UTC（北京时间 = UTC+8）。
    # 错开整点（用 :17）——整点是 Actions 最拥堵的时候，容易延迟甚至被丢弃。
    - cron: '17 */6 * * *'
  workflow_dispatch:          # 也支持在网页上手动点一下立刻跑

# 同一时刻只允许一轮，避免两轮并发去抢源站的查询额度
concurrency:
  group: kaquan-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write     # 保活提交需要写权限
    env:
      # runner 默认是 UTC，会让日志里的时间戳（update.sh 的 ts()）比北京时间早 8 小时。
      # 数据时间戳另有代码层保证（build_web.py 显式用 UTC+8），这里只管日志可读性。
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 商家商品接口的缓存（约 1500 个文件 / 12MB，TTL 24 小时）。
      # 没有它，每轮都要重新拉全部「商家×品类」的商品列表，会慢几十分钟。
      # key 带 run_id 是为了每轮都存一份新缓存，restore-keys 回退到最近一次。
      - name: 恢复商品直链缓存
        uses: actions/cache@v4
        with:
          path: site/pipeline/cache
          key: kaquan-goods-${{ github.run_id }}
          restore-keys: |
            kaquan-goods-

      - name: 安装 surge CLI
        run: npm install -g surge

      # 把「密钥错了」「源站被墙」这两类问题挡在抓取之前。
      # 不这么做的话，要等 40 分钟抓完才在最后一步失败，白烧一个 runner 时段。
      - name: 发布通道预检（surge 密钥）
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          set -u
          if [ -z "${SURGE_TOKEN:-}" ]; then
            echo "::error::没取到 SURGE_TOKEN。请到仓库 Settings -> Secrets and variables -> Actions，新增名为 SURGE_TOKEN 的 secret。"
            exit 1
          fi
          echo "SURGE_TOKEN 已注入（长度 ${#SURGE_TOKEN}）"
          # 关键坑：surge whoami 即便 token 是错的也照样返回退出码 0，
          # 只能靠输出文本判断，看退出码会被骗。
          out=$(surge whoami 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qi "not authenticated"; then
            echo "::error::SURGE_TOKEN 无效（surge 报 Not Authenticated）。请核对 secret 的值。"
            exit 1
          fi
          if ! echo "$out" | grep -qE '[[:alnum:]._%+-]+@[[:alnum:].-]+'; then
            echo "::error::没能从 surge 输出里识别到账号，token 可能无效。"
            exit 1
          fi
          echo "密钥有效，可以发布。"

      # 这台 runner 的 IP 在 Azure 机房段。源站是香港的 nginx，
      # 正常应该能通；万一被拦，早点失败，别白跑一小时。
      - name: 源站连通性预检
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://kaquanjishi.com/price-check)
          echo "kaquanjishi.com/price-check -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::源站返回 HTTP $code，这台 runner 的 IP 可能被源站拦了，本轮中止。"
            exit 1
          fi

      - name: 抓取 + 构建 + 发布
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: bash update.sh

      # 发布完回头查一眼线上数据时间，确认真的更到了
      - name: 发布结果自检
        run: |
          sleep 5
          live=$(curl -s --max-time 30 "https://kaquan-bijia.surge.sh/data/meta.json?t=$(date +%s)" \
                 | sed 's/.*"generated":"\([^"]*\)".*/\1/' | head -c 40)
          echo "线上数据时间：$live"

      # GitHub 规定：仓库连续 60 天没有「提交」就自动停用定时任务，
      # 而且几乎不发通知 —— 最阴的一类静默失效。
      # 本任务只把静态站发到 surge，自己从不产生提交，所以必须主动保活。
      # 用「距上次提交是否超过 40 天」来判断，而不是判断"是不是 1 号"：
      # cron 在 UTC 跑，北京时间 1 号的那一轮对应 UTC 的 31 号，按日期判断会错位。
      - name: 保活提交（防 60 天无活动被停用）
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "距上次提交 $days 天"
          if [ "$days" -lt 40 ]; then
            echo "还没到 40 天，跳过保活提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: 保活提交（防定时任务因 60 天无活动被停用）[skip ci]"
          git push
